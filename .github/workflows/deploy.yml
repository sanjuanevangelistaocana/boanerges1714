name: Build and Deploy to Firebase

on:
  push:
    branches:
      - dev
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web app
        run: flutter build web --release

      - name: Deploy Hosting, Firestore and Storage rules
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting,firestore:rules,firestore:indexes,storage:rules
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: boanerges1714

      - name: Set CORS on Firebase Storage bucket
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Apply CORS configuration
        uses: google-github-actions/setup-gcloud@v2

      - name: Run gsutil cors set
        run: gsutil cors set cors.json gs://boanerges1714.firebasestorage.app

      - name: Setup Node.js (for Cloud Functions)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Cloud Functions dependencies
        run: npm install
        working-directory: functions

      - name: Deploy Cloud Functions
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: boanerges1714

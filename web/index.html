<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Cofradía de San Juan Evangelista de Ocaña - App oficial">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Cofradía San Juan">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#5B2C6F">

  <title>Cofradía de San Juan Evangelista - Ocaña</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #5B2C6F;
      font-family: sans-serif;
    }
    .loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }
    .loading h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    .loading p {
      font-size: 14px;
      opacity: 0.7;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #D4AC0D;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <h1>Cofradía de San Juan Evangelista</h1>
    <p>Cargando...</p>
  </div>

  <script>
    (function () {
      var loading = document.getElementById('loading');
      var observer;
      var hideLoading = function () {
        if (loading) {
          loading.remove();
          loading = null;
        }
        if (observer) {
          observer.disconnect();
        }
      };
      observer = new MutationObserver(function () {
        if (document.querySelector('flt-glass-pane, flutter-view')) {
          hideLoading();
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // Flutter 3.x dispatches this event after the first frame. The timeout
      // prevents a broken bootstrap from leaving the static loader forever.
      window.addEventListener('flutter-first-frame', hideLoading);
      window.setTimeout(function () {
        if (loading) {
          console.error('Flutter no emitió flutter-first-frame en 20 segundos.');
          hideLoading();
        }
      }, 20000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
